<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aroha — オフライン</title>
<style>
  body {
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    background: #F7F3EC;
    color: #2A2118;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    margin: 0;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(42,33,24,0.12);
  }
  .icon { font-size: 3rem; margin-bottom: 16px; }
  h1 {
    font-size: 1.3rem;
    color: #3D5740;
    margin-bottom: 12px;
    font-weight: 700;
  }
  p {
    font-size: 0.87rem;
    color: #6B4F3A;
    line-height: 1.8;
    margin-bottom: 24px;
  }
  .btn {
    background: #3D5740;
    color: white;
    border: none;
    border-radius: 100px;
    padding: 12px 28px;
    font-size: 0.87rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .note {
    margin-top: 20px;
    font-size: 0.77rem;
    color: #A07A5F;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🌿</div>
  <h1>オフラインです</h1>
  <p>インターネットに接続されていないため、<br>このページを表示できません。</p>
  <a href="/kodomo-support/" class="btn">Aroha を開く</a>
  <div class="note">
    日記・成長記録・振り返りは<br>
    オフラインでもご利用いただけます。<br>
    AIアドバイスはオンライン時のみ利用可能です。
  </div>
</div>
</body>
</html>
